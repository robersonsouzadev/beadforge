services:
  postgres:
    image: postgres:16-alpine
    container_name: beadforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beadforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beadforge_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-beadforge_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beadforge} -d ${POSTGRES_DB:-beadforge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  beadforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beadforge-studio
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgres://${POSTGRES_USER:-beadforge}:${POSTGRES_PASSWORD:-beadforge_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-beadforge_db}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY=${NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY}
      - NEXT_PUBLIC_STRIPE_PRICE_PRO_YEARLY=${NEXT_PUBLIC_STRIPE_PRICE_PRO_YEARLY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  postgres_data:

